<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Күзетші көмекшісі</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E3F0FB">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#E3F0FB; --top:#FFFFFF; --ink:#1B1B1F; --line:#79747E; --accent:#00BFFF;
  --no:#FDE8EA; --yes:#E8F3E6; --st:#FFFFFF; --bgs:#E6F4E8; --navbg:#EAF6FD; --muted:#49454F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10202D; --top:#17232E; --ink:#EEF2F6; --line:#8C9AA6; --accent:#4FD3FF;
    --no:#4A2227; --yes:#21392A; --st:#1E2D3A; --bgs:#12261A; --navbg:#17232E; --muted:#B8C4CE;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{--page:var(--bg);margin:0;background:var(--page);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{background:var(--top);display:flex;justify-content:center;padding:14px 16px}
header svg{width:min(280px,70vw);height:auto;color:var(--ink)}
main{max-width:560px;margin:0 auto;padding:22px 16px 110px}
.field{position:relative}
.field label{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;pointer-events:none;transition:all .15s;background:transparent;padding:0 6px}
.field input{width:100%;height:68px;border-radius:28px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:32px;font-weight:700;text-align:center;outline:none;letter-spacing:2px}
.field input:focus,.field input:not(:placeholder-shown){border-color:var(--accent);border-width:2px}
.field input:focus + label,.field input:not(:placeholder-shown) + label{top:0;font-size:13px;color:var(--accent);background:var(--page)}
#list{margin-top:22px;display:grid;gap:16px}
.card{border-radius:24px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card.no{background:var(--no)} .card.yes{background:var(--yes)}
.card h2{margin:0 0 10px;font-size:30px;font-weight:700}
.card p{margin:6px 0 0;font-size:20px;font-weight:700;line-height:1.35}
.empty{text-align:center;color:var(--muted);font-size:17px;margin-top:28px;line-height:1.5}

.field.s input{font-size:22px;letter-spacing:0}
.card.st{background:var(--st);padding:16px 20px}
.card.st h2{font-size:21px;margin:0 0 8px;line-height:1.3}
.card.st p{font-size:19px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--navbg);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 6px rgba(0,0,0,.12);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;cursor:pointer}
nav button span.pill{display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px}
nav button[aria-selected="true"] span.pill{background:#E8DEF8;color:#1D192B}
nav svg{width:24px;height:24px}
.inst{margin-bottom:16px;text-align:center}
.inst button{background:#0B57D0;color:#fff;border:0;border-radius:24px;padding:12px 22px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.inst p{margin:10px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
[hidden]{display:none!important}
body[data-view="stations"]{--page:var(--bgs)}
#hs{display:none}
body[data-view="stations"] #hs{display:block}
body[data-view="stations"] #hw{display:none}
#hh{display:none}
body[data-view="hours"] #hh{display:block}
body[data-view="hours"] #hw{display:none}
#v-hours{--ok:#1f7a4d;--warn:#b4531a;--bar:rgba(128,128,128,.28);--hl:rgba(128,128,128,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #v-hours{--ok:#4cc58a;--warn:#e8925a}}
#v-hours .hhd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 14px}
#v-hours .httl{font-size:24px;font-weight:700}
#v-hours button{font:inherit;font-size:16px;font-weight:700;padding:10px 20px;border:1.5px solid #0B57D0;border-radius:999px;background:#0B57D0;color:#fff;cursor:pointer;margin-top:16px}
#v-hours #pb,#v-hours #h-pb,#v-hours #h-vip{margin:0;font-size:14px;padding:6px 14px;background:transparent;color:var(--ok);border-color:var(--ok)}
#v-hours #h-pb[aria-pressed="true"],#v-hours #h-vip[aria-pressed="true"]{background:var(--ok);color:var(--st)}
#v-hours #h-lo{margin:0;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:6px}
#v-hours .card{background:var(--st);border-radius:24px;padding:14px 20px;box-shadow:0 1px 4px rgba(0,0,0,.12);margin:0 0 14px;font-size:17px}
#v-hours .card h2{font-size:20px;margin:0 0 6px}
#v-hours .card p{font-size:15px;font-weight:400;margin:6px 0 0;line-height:1.4}
#v-hours .row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--hl)}
#v-hours .row:last-of-type{border:0}#v-hours .row b{font-size:20px}
#v-hours .bar{height:12px;background:var(--bar);border-radius:6px;overflow:hidden;margin:12px 0 4px;position:relative}
#v-hours .bar i,#v-hours .bar u{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}#v-hours .bar u{opacity:.35}
#v-hours .days{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
#v-hours .d{border:1px solid var(--hl);border-radius:6px;text-align:center;font-size:12px;padding:3px 0;line-height:1.3}#v-hours .d span{display:block;color:var(--muted);font-size:10px}
#v-hours .d.p{border-style:dashed;color:var(--muted)}#v-hours .d.z{opacity:.55}
#v-hours .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#v-hours .chip{margin:0;font-size:14px;padding:5px 12px;background:var(--st);color:var(--ink);border-color:var(--hl)}
#v-hours .chip[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--st)}
#v-hours .err{color:var(--warn)}#v-hours .note{font-size:12px;color:var(--muted)}
#v-hours table{border-collapse:collapse;width:100%;font-size:17px}
#v-hours th,#v-hours td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--hl)}
#v-hours th:first-child,#v-hours td:first-child{text-align:left;font-weight:700}
#v-hours thead th{position:sticky;top:0;background:var(--st);font-size:14px;z-index:1}
#v-hours td.b,#v-hours th.b{background:rgba(70,160,220,.30)}#v-hours td.r,#v-hours th.r{background:rgba(225,60,45,.34)}#v-hours td.g,#v-hours th.g{background:rgba(135,175,60,.36)}
#v-hours tr.me td:first-child{text-decoration:underline}
#v-hours .pos{color:var(--ok)}#v-hours .neg{color:var(--warn)}
</style>
</head>

<main>
<div id="inst" class="inst" hidden><button id="ib" type="button">Басты экранға қосу</button><p id="ih" hidden></p></div>
<section id="v-wagons">
  <div class="field">
    <input id="q" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" placeholder=" " aria-label="Жүк кодын енгізіңіз">
    <label for="q">Жүк кодын енгізіңіз</label>

function render(){

    '<p>Мәлімет: ' + esc(t) + '</p></div>').join("") +
    (all.length > hits.length ? '<div class="empty">Тағы ' + (all.length - hits.length) + ' нәтиже бар. Кодтың келесі цифрларын енгізіңіз.</div>' : "");

const API='https://saghat-api.g-had-nk.workers.dev';
const $=id=>document.getElementById('h-'+id);
const KZ=['Қаңтар','Ақпан','Наурыз','Сәуір','Мамыр','Маусым','Шілде','Тамыз','Қыркүйек','Қазан','Қараша','Желтоқсан'];
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const sgn=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NOW=new Date(),CK=NOW.getFullYear()+'-'+String(NOW.getMonth()+1).padStart(2,'0');
let TOKEN='',ME=null,CARDS={},CUR=null,PAST=[],STALE=false,sel=-1,showPrev=false,showAll=false,asel='';
try{TOKEN=localStorage.getItem('sg_tok')||''}catch(e){}
const save=t=>{TOKEN=t;try{t?localStorage.setItem('sg_tok',t):localStorage.removeItem('sg_tok')}catch(e){}};
async function call(path,body){
  try{const r=await fetch(API+path,{method:body?'POST':'GET',headers:Object.assign({'content-type':'application/json'},TOKEN?{authorization:'Bearer '+TOKEN}:{}),body:body?JSON.stringify(body):undefined});
    return{ok:r.ok,s:r.status,j:await r.json().catch(()=>({}))}}catch(e){return{ok:false,s:0,j:{error:'net'}}}
}
function loginView(msg){
  $('pb').hidden=true;$('vip').hidden=true;$('lo').hidden=true;$('ttl').textContent='Менің сағатым';
  $('app').innerHTML=`<div class="field"><input id="h-t" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="username" placeholder=" "><label for="h-t">Табель №</label></div><div class="field" style="margin-top:16px"><input id="h-p" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" placeholder=" "><label for="h-p">PIN (4 сан)</label></div><button id="h-go" type="button">Кіру</button><p class="err" id="h-msg">${msg||''}</p>`;
  $('go').onclick=async()=>{
    const t=$('t').value.trim(),p=$('p').value.trim();
    if(!t||p.length!==4){$('msg').textContent='Табель нөмірі мен 4 таңбалы PIN енгізіңіз.';return}
    const r=await call('/api/login',{tab:t,pin:p});
    if(r.ok){save(r.j.token);start()}
    else if(r.j.error==='locked')$('msg').textContent=`Тым көп қате енгізілді. ${Math.ceil((r.j.retry_after||1800)/60)} минуттан кейін қайталаңыз немесе PIN қалпына келтіруді сұраңыз.`;
    else if(r.s===0)$('msg').textContent='Байланыс жоқ. Интернетті тексеріңіз.';
    else $('msg').textContent='Табель нөмірі немесе PIN қате.';
  };
}
function pinView(){
  $('pb').hidden=true;$('vip').hidden=true;$('lo').hidden=false;
  $('app').innerHTML=`<div class="card"><h2>Жаңа PIN ойлап табыңыз</h2><p class="note">Берілген PIN-ді тек бір рет қолданасыз. 4 сан, 1234 немесе 0000 сияқты оңай емес.</p></div><div class="field"><input id="h-n1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" placeholder=" "><label for="h-n1">Жаңа PIN</label></div><div class="field" style="margin-top:16px"><input id="h-n2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" placeholder=" "><label for="h-n2">Қайталаңыз</label></div><button id="h-go" type="button">Сақтау</button><p class="err" id="h-msg"></p>`;
  $('go').onclick=async()=>{
    const a=$('n1').value.trim(),b=$('n2').value.trim();
    if(!/^\d{4}$/.test(a)){$('msg').textContent='PIN дәл 4 сан болуы керек.';return}
    if(a!==b){$('msg').textContent='Екі PIN сәйкес емес.';return}
    const r=await call('/api/change-pin',{pin:a});
    if(r.ok)start();else $('msg').textContent=r.j.error==='weak'?'Бұл PIN тым оңай, басқасын таңдаңыз.':'Қате шықты, қайталаңыз.';
  };
}
async function loadCard(ym){
  if(CARDS[ym])return CARDS[ym];
  const r=await call('/api/me?ym='+ym);if(r.ok&&r.j.card&&r.j.ym===ym){CARDS[ym]=r.j.card;return r.j.card}return null;
}
async function start(){
  const r=await call('/api/me');
  if(r.s===401){save('');return loginView('Қайта кіріңіз.')}
  if(!r.ok)return loginView('Қате шықты, кейінірек қайталаңыз.');
  if(r.j.must_change)return pinView();
  ME=r.j;CARDS={};if(ME.card)CARDS[ME.ym]=ME.card;
  const ms=ME.months;
  if(!ms.length){$('app').innerHTML='<div class="card">Сіздің деректеріңіз әлі жарияланбаған.</div>';$('lo').hidden=false;return}
  const last=ms[ms.length-1];
  STALE=!ms.some(m=>m.ym===CK)&&last.ym<CK;
  CUR=STALE?null:(ms.find(m=>m.ym===CK)||last);
  PAST=ms.filter(m=>m.ym.slice(0,4)===String(NOW.getFullYear())&&m.ym<CK);
  sel=PAST.length-1;showPrev=false;showAll=false;asel=CUR?CUR.ym:'';$('vip').hidden=!ME.vip;$('vip').setAttribute('aria-pressed','false');
  $('pb').hidden=!PAST.length;$('pb').setAttribute('aria-pressed','false');$('lo').hidden=false;
  $('ttl').textContent='Менің сағатым ('+(CUR?CUR.name:KZ[NOW.getMonth()])+')';
  if(CUR)await loadCard(CUR.ym);
  draw();
}
const notes=c=>(c.e8?`<div class="note">8 сағаттық график${c.s8>0?` (${c.s8+1}-күннен)`:''}: күніне 8 сағат, 5 сағаттық күн есептелмейді.</div>`:'')+(c.st?`<div class="note">Жаңа күзетші: норма ${c.st+1}-күннен бастап есептелген.</div>`:'');
function curHtml(c){
  const R=x=>c.norm>0?Math.min(100,x/c.norm*100):(x>0?100:0);
  const cells=c.cal.map((raw,i)=>{const t=typeof raw==='string'?raw:(i>=c.last?'':(raw>0?fmt(raw):'–'));return`<div class="d${i>=c.last?' p':''}${t==='–'?' z':''}"><span>${i+1}</span>${esc(t)}</div>`}).join('');
  return`<div class="card">
  <div class="row"><span>Айлық норма</span><b>${fmt(c.norm)} сағ</b></div>${notes(c)}
  <div class="row"><span>${c.last}-күнге дейін істелген</span><b>${fmt(c.worked)} сағ</b></div>
  <div class="row"><span>Оның ішінде: осы айда</span><span>${fmt(c.month)} сағ</span></div>
  ${c.crW?`<div class="row"><span>Оның ішінде: Г, ОС, К күндері</span><span>+${fmt(c.crW)} сағ</span></div>`:''}
  <div class="row"><span>Оның ішінде: алдыңғы айдан ауысқан</span><span>${c.f>0?'+':''}${fmt(c.f)} сағ</span></div>
  <div class="row"><span>Нормаға дейін қалды</span><b>${fmt(c.left)} сағ</b></div>
  <div class="row"><span>Ай соңына болжам</span><b>${fmt(c.proj)} сағ</b></div>
  <div class="row"><span>Болжам мен норма айырмасы</span><b class="${c.dproj>=0?'pos':'neg'}">${sgn(c.dproj)} сағ</b></div>
  <div class="row"><span>Түнгі сағат: ${c.last}-күнге дейін</span><b>${fmt(c.nw)} сағ</b></div>
  <div class="row"><span>Түнгі сағат: ай соңына болжам</span><b>${fmt(c.np)} сағ</b></div>
  <div class="row"><span>Мейрам күндері істелген</span><b>${fmt(c.h)} сағ</b></div>
  ${c.el?`<div class="row"><span>Алып жүру (осы айда)</span><b>${fmt(c.e||0)} сағ</b></div><div class="row"><span>Пойыздағы жұмыс (осы айда)</span><b>${fmt(c.tr||0)} рет</b></div><div class="note">Алып жүру мен пойыздағы жұмыс — жеке кестеден, ${c.el}-күнге дейін.</div>`:''}
  <div class="bar"><u style="width:${R(c.proj)}%"></u><i style="width:${R(c.worked)}%"></i></div>
  <div class="note">Тұтас — істелген (ауысқан сағатпен), бозғылт — болжам. Болжам: әр ауысымға 22 сағаттан (13 + 9), күзетшінің ауысым кезеңімен.</div>
  <div class="days">${cells}</div><div class="note">Түнгі (22:00–06:00), мейрам және алып жүру сағаттары жалпы сағаттың ішінде есептелген.</div></div>`;
}
function sumHtml(c,m){
  const d=c.dfin;
  return`<div class="card"><h2>${m.name} айының қорытындысы</h2>
  <div class="row"><span>Айлық норма</span><b>${fmt(c.norm)} сағ</b></div>${notes(c)}
  <div class="row"><span>Істелген (ауысқан сағатпен)</span><b>${fmt(c.worked)} сағ</b></div>
  <div class="row"><span>${d>=0?'Артық':'Жетпейтін'} сағат</span><b class="${d>=0?'pos':'neg'}">${sgn(d)} сағ</b></div>
  <div class="row"><span>Түнгі сағат</span><span>${fmt(c.nw)} сағ</span></div>
  <div class="row"><span>Мейрам күндері істелген</span><span>${fmt(c.h)} сағ</span></div>
  <div class="row"><span>Алып жүру</span><span>${fmt(c.s)} сағ</span></div>
  <div class="row"><span>Пойыздағы жұмыс</span><span>${fmt(c.p)} рет</span></div>
  <div class="note">Түнгі, мейрам, алып жүру және пойыздағы жұмыс сағаттары жалпы сағаттың ішінде есептелген.</div></div>`;
}
async function drawAll(){
  const r=await call('/api/vip'+(asel?'?ym='+asel:''));
  if(!r.ok){$('app').innerHTML='<div class="card err">Бұл бөлім сізге қолжетімсіз.</div>';return}
  const j=r.j;asel=j.ym||'';
  if(!j.rows||!j.rows.length){$('app').innerHTML='<div class="card">Деректер әлі жарияланбаған.</div>';return}
  const yr=String(NOW.getFullYear());
  const chips='<div class="chips">'+j.months.filter(m=>m.ym.slice(0,4)===yr).map(m=>`<button type="button" class="chip" data-a="${m.ym}" aria-pressed="${m.ym===j.ym}">${m.name}</button>`).join('')+'</div>';
  const rows=j.rows.map(([t,w,l,n])=>`<tr${t===ME.tab?' class="me"':''}><td>${esc(t)}</td><td class="b">${fmt(w)}</td><td class="r">${fmt(l)}</td><td class="g">${fmt(n)}</td></tr>`).join('');
  $('app').innerHTML=chips+`<div class="card" style="padding:0"><table><thead><tr><th>Күзетші</th><th class="b">Істеген</th><th class="r">Істеу керек</th><th class="g">Норма</th></tr></thead><tbody>${rows}</tbody></table></div><div class="note">Күзетшілер табель нөмірімен көрсетілген.${j.last?` Табель ${j.last}-күнге дейін толған.`:''}</div>`;
}
async function draw(){
  if(showAll){await drawAll();return}
  let h='';
  if(showPrev){
    h='<div class="chips">'+PAST.map((m,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="${i===sel}">${m.name}</button>`).join('')+'</div>';
    const m=PAST[sel],c=m&&await loadCard(m.ym);
    h+=c?sumHtml(c,m):'<div class="card err">Бұл айдың деректері табылмады.</div>';
  }else if(STALE)h='<div class="card">'+KZ[NOW.getMonth()]+' айының табелі әлі енгізілмеген. Өткен айдың нәтижесін жоғарыдағы батырмамен көре аласыз.</div>';
  else{const c=CARDS[CUR.ym];h=c?curHtml(c):'<div class="card err">Деректер табылмады.</div>'}
  $('app').innerHTML=h;
}
$('pb').onclick=()=>{showPrev=!showPrev;if(showPrev){showAll=false;$('vip').setAttribute('aria-pressed','false')}$('pb').setAttribute('aria-pressed',showPrev);draw()};
$('vip').onclick=()=>{showAll=!showAll;if(showAll){showPrev=false;$('pb').setAttribute('aria-pressed','false')}$('vip').setAttribute('aria-pressed',showAll);draw()};
$('lo').onclick=()=>{save('');ME=null;loginView()};
$('app').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button[data-i]');if(b){sel=+b.dataset.i;draw()}const a=e.target.closest&&e.target.closest('button[data-a]');if(a){asel=a.dataset.a;draw()}});
let inited=false;
window.__hoursInit=()=>{if(inited)return;inited=true;TOKEN?start():loginView()};
if(document.body.dataset.view==='hours')window.__hoursInit();
})();
/*ENDHOURS*/
</script>
</body>
</html>
