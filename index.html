<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Күзетші көмекшісі</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E3F0FB">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Күзетші">
<style>
:root{
  --bg:#eef4fb; --top:#FFFFFF; --ink:#0b2a4a; --line:#8fa9c8; --accent:#1565c0; --t1:#cfe0f7; --t2:#d5efdc; --t3:#fbe7c0; --t4:#e3dcf5; --tx2:#2f4a68; --cy:#d5efdc; --cyt:#124a26; --cn:#fbdcdc; --cnt:#7a1a1a;
  --no:#fff; --yes:#fff; --st:#FFFFFF; --bgs:#eef4fb; --navbg:#fff; --muted:#4a6585;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b2a; --top:#17283b; --ink:#eaf2fb; --line:#5d7894; --accent:#7db4ff; --t1:#1e3a5f; --t2:#1f4a35; --t3:#5a4720; --t4:#3d3563; --tx2:#c4d4e6; --cy:#1d4a2e; --cyt:#8fe3b0; --cn:#5a2427; --cnt:#ffb4b0;
    --no:#17283b; --yes:#17283b; --st:#17283b; --bgs:#0f1b2a; --navbg:#17283b; --muted:#9db4cc;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{--page:var(--bg);margin:0;background:var(--page);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.field{position:relative}
.field label{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;pointer-events:none;transition:all .15s;background:transparent;padding:0 6px}
.field input{width:100%;height:68px;border-radius:28px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:32px;font-weight:700;text-align:center;outline:none;letter-spacing:2px}
.field input:focus,.field input:not(:placeholder-shown){border-color:var(--accent);border-width:2px}
.field input:focus + label,.field input:not(:placeholder-shown) + label{top:0;font-size:13px;color:var(--accent);background:var(--page)}
#list{margin-top:22px;display:grid;gap:16px}
.card{border-radius:24px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card.no{background:var(--no)} .card.yes{background:var(--yes)}
.card h2{margin:0 0 10px;font-size:30px;font-weight:700}
.card p{margin:6px 0 0;font-size:20px;font-weight:700;line-height:1.35}
.empty{text-align:center;color:var(--muted);font-size:17px;margin-top:28px;line-height:1.5}

.field.s input{font-size:22px;letter-spacing:0}
.card.st{background:var(--st);padding:16px 20px}
.card.st h2{font-size:21px;margin:0 0 8px;line-height:1.3}
.card.st p{font-size:19px}
.inst{margin-bottom:16px;text-align:center}
.inst button{background:#0B57D0;color:#fff;border:0;border-radius:24px;padding:12px 22px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.inst p{margin:10px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
[hidden]{display:none!important}
#v-hours{--ok:#1f7a4d;--warn:#b4531a;--bar:rgba(128,128,128,.28);--hl:rgba(128,128,128,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #v-hours{--ok:#4cc58a;--warn:#e8925a}}
#v-hours .hhd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 14px}
#v-hours .httl{font-size:24px;font-weight:700}
#v-hours button{font:inherit;font-size:16px;font-weight:700;padding:10px 20px;border:1.5px solid #0B57D0;border-radius:999px;background:#0B57D0;color:#fff;cursor:pointer;margin-top:16px}
#v-hours #pb,#v-hours #h-pb,#v-hours #h-vip{margin:0;font-size:14px;padding:6px 14px;background:transparent;color:var(--ok);border-color:var(--ok)}
#v-hours #h-pb[aria-pressed="true"],#v-hours #h-vip[aria-pressed="true"]{background:var(--ok);color:var(--st)}
#v-hours #h-lo{margin:0;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:6px}
#v-hours .card{background:var(--st);border-radius:24px;padding:14px 20px;box-shadow:0 1px 4px rgba(0,0,0,.12);margin:0 0 14px;font-size:17px}
#v-hours .card h2{font-size:20px;margin:0 0 6px}
#v-hours .card p{font-size:15px;font-weight:400;margin:6px 0 0;line-height:1.4}
#v-hours .row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--hl)}
#v-hours .row:last-of-type{border:0}#v-hours .row b{font-size:20px}
#v-hours .bar{height:12px;background:var(--bar);border-radius:6px;overflow:hidden;margin:12px 0 4px;position:relative}
#v-hours .bar i,#v-hours .bar u{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}#v-hours .bar u{opacity:.35}
#v-hours .days{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
#v-hours .d{border:1px solid var(--hl);border-radius:6px;text-align:center;font-size:12px;padding:3px 0;line-height:1.3}#v-hours .d span{display:block;color:var(--muted);font-size:10px}
#v-hours .d.p{border-style:dashed;color:var(--muted)}#v-hours .d.z{opacity:.55}
#v-hours .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#v-hours .chip{margin:0;font-size:14px;padding:5px 12px;background:var(--st);color:var(--ink);border-color:var(--hl)}
#v-hours .chip[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--st)}
#v-hours .updb[hidden]{display:none}
.updb{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2px solid var(--ok);font-weight:700}
#v-hours .updb button{margin:0;padding:8px 16px;white-space:nowrap}
#v-hours .err{color:var(--warn)}#v-hours .note{font-size:12px;color:var(--muted)}
#v-hours table{border-collapse:collapse;width:100%;font-size:17px}
#v-hours th,#v-hours td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--hl)}
#v-hours th:first-child,#v-hours td:first-child{text-align:left;font-weight:700}
#v-hours thead th{position:sticky;top:0;background:var(--st);font-size:14px;z-index:1}
#v-hours td.b,#v-hours th.b{background:rgba(70,160,220,.30)}#v-hours td.r,#v-hours th.r{background:rgba(225,60,45,.34)}#v-hours td.g,#v-hours th.g{background:rgba(135,175,60,.36)}
#v-hours tr.me td:first-child{text-decoration:underline}
#v-hours .rd{color:#d32f2f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #v-hours .rd{color:#ff7b72}}
#v-hours .pos{color:var(--ok)}#v-hours .neg{color:var(--warn)}
#v-calc{--ok:#1f7a4d;--warn:#b4531a;--hl:rgba(128,128,128,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #v-calc{--ok:#4cc58a;--warn:#e8925a}}
#v-calc .cb{background:var(--st);border-radius:24px;padding:14px 20px;box-shadow:0 1px 4px rgba(0,0,0,.12);margin:0 0 14px;font-size:17px}
#v-calc .cb.rest{border:1.5px dashed var(--line)}
#v-calc h2{font-size:18px;margin:0 0 8px}
#v-calc .cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#v-calc label{display:block;font-size:13px;color:var(--muted)}
#v-calc input[type=time],#v-calc input[type=number]{display:block;width:100%;margin-top:4px;padding:8px 10px;font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:14px}
#v-calc input:focus{border-color:var(--accent);outline:none}
#v-calc .chk{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--ink);font-size:15px}
#v-calc .chk input{width:20px;height:20px;margin:0}
#v-calc .cr{display:flex;gap:8px;margin-bottom:14px}
#v-calc button{flex:1;font:inherit;font-size:16px;font-weight:700;padding:10px 14px;border:1.5px solid #0B57D0;border-radius:999px;background:#0B57D0;color:#fff;cursor:pointer}
#v-calc button.g{background:transparent;color:var(--accent);border-color:var(--accent)}
#v-calc summary{cursor:pointer;font-size:15px;font-weight:600}
#v-calc .cmu{color:var(--muted);font-size:14px;margin:0}
#v-calc .cbig{font-size:32px;font-weight:700;color:var(--ok)}
#v-calc .csp{font-size:24px;font-weight:700;margin:6px 0 2px}
#v-calc .cwn{color:var(--warn);font-size:14px;margin:8px 0 0}
#v-calc .ct{overflow-x:auto}
#v-calc table{border-collapse:collapse;width:100%;font-size:15px;margin-top:10px}
#v-calc td,#v-calc th{padding:6px 4px;border-bottom:1px solid var(--hl);text-align:left;white-space:nowrap}
.tb{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:22px;font-weight:700}
.bk{width:44px;height:44px;flex:none;border-radius:50%;background:var(--st);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.15);text-decoration:none}
.ttl0{padding:8px 0 6px;font-size:28px;font-weight:700}.ttl0 small{display:block;font-size:15px;font-weight:500;color:var(--muted);margin-top:4px}
#home-g{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
#home-g[data-vip="0"] .tile:nth-child(3){grid-column:1/-1;min-height:150px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:200px;padding:18px;border-radius:28px;color:var(--ink);text-decoration:none}
.tile svg{width:44px;height:44px}
.tile b{display:block;font-size:22px;margin-bottom:6px}
.tile>div>span{display:block;font-size:14px;line-height:1.35;color:var(--tx2)}
.tile .vip{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:11px;vertical-align:middle}
.cs{display:inline-block;padding:5px 14px;border-radius:12px;font-size:15px}
.cs.y{background:var(--cy);color:var(--cyt)}.cs.n{background:var(--cn);color:var(--cnt)}
</style>
</head>
<body>
<main>
<div id="inst" class="inst" hidden><button id="ib" type="button">Басты экранға қосу</button><p id="ih" hidden></p></div>
<section id="v-home">
<div class="ttl0">Күзетші көмекшісі<small>Бөлімді таңдаңыз</small></div>
<div class="g" id="home-g" data-vip="0">
<a class="tile" href="#wagons" style="background:var(--t1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="11" rx="2"></rect><circle cx="8" cy="19" r="1.5"></circle><circle cx="16" cy="19" r="1.5"></circle></svg><div><b>Вагондар</b><span>Жүк коды бойынша күзетті тексеру</span></div></a>
<a class="tile" href="#stations" style="background:var(--t2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg><div><b>Станциялар</b><span>Атауы немесе коды бойынша іздеу</span></div></a>
<a class="tile" href="#hours" style="background:var(--t3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><div><b>Сағат</b><span>Менің сағатым және норма</span></div></a>
<a class="tile" id="t-calc" href="#calc" style="background:var(--t4)" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"></path></svg><div><b>Есептегіш<span class="vip">VIP</span></b><span>Маршрут бойынша жұмыс сағатын есептеу</span></div></a>
</div>
</section>
<section id="v-wagons" hidden>
<div class="tb"><a class="bk" href="#home" aria-label="Артқа"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>Вагондар</div>
  <div class="field">
    <input id="q" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" placeholder=" " aria-label="Жүк кодын енгізіңіз">
    <label for="q">Жүк кодын енгізіңіз</label>
  </div>
  <div id="list" aria-live="polite"></div>
</section>
<section id="v-stations" hidden>
<div class="tb"><a class="bk" href="#home" aria-label="Артқа"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>Станциялар</div>
  <div class="field s">
    <input id="q2" type="text" autocomplete="off" placeholder=" " aria-label="Станция атауын немесе кодын енгізіңіз">
    <label for="q2">Станция атауын немесе кодын енгізіңіз</label>
  </div>
  <div id="list2" aria-live="polite"></div>
</section>
<section id="v-hours" hidden>
<div class="tb"><a class="bk" href="#home" aria-label="Артқа"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>Сағат</div>
  <div class="hhd"><div id="h-ttl" class="httl">Менің сағатым</div><button id="h-pb" type="button" aria-pressed="false" hidden>Өткен ай қорытындысы</button><button id="h-vip" type="button" aria-pressed="false" hidden>Барлық күзетші</button><button id="h-lo" type="button" hidden>Шығу</button></div>
  <div id="h-upd" class="card updb" hidden>Деректер жаңартылды. <button id="h-ub" type="button">Жаңарту</button></div>
  <div id="h-app"></div>
</section>
<section id="v-calc" hidden>
<div class="tb"><a class="bk" href="#home" aria-label="Артқа"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>Маршрут есептегіш</div>
  <div class="cb"><label>Маршрут ашылды (ауысым басталды)<input type="time" id="c-start"></label></div>
  <div id="c-legs"></div>
  <div class="cr"><button id="c-add" type="button">+ Жол қосу</button><button id="c-del" type="button" class="g">− Соңғысын өшіру</button></div>
  <details class="cb"><summary>Параметрлер</summary><div class="cg" style="margin-top:10px"><label>Демалыстың есептелетін үлесі (%)<input type="number" id="c-rk" value="50" min="0" max="100"></label><label>Бос құрам үлесі (%)<input type="number" id="c-ek" value="50" min="0" max="100"></label></div></details>
  <div class="cb" id="c-res"></div>
</section>
</main>
<script>
// [код, күзет (1 = КҮЗЕТТЕ БАР, 0 = КҮЗЕТТЕ ЖОҚ), жүк атауы]
let DATA = [];
const q = document.getElementById("q"), list = document.getElementById("list");
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const v = q.value.replace(/\D/g,"");
  if (v !== q.value) q.value = v;
  if (!v){ list.innerHTML = ""; return; }
  if (!DATA.length){ list.innerHTML = catMsg(); return; }
  const all = DATA.filter(r => r[0].startsWith(v)), hits = all.slice(0,100);
  if (!hits.length){
    list.innerHTML = '<div class="empty">Мұндай код табылмады.<br>Кодты қайта тексеріп көріңіз.</div>';
    return;
  }
  list.innerHTML = hits.map(([c,g,t]) =>
    '<div class="card ' + (g ? "yes" : "no") + '"><h2>Код: ' + esc(c) + '</h2>' +
    '<p><span class="cs ' + (g ? "y" : "n") + '">' + (g ? "КҮЗЕТТЕ БАР" : "КҮЗЕТТЕ ЖОҚ") + '</span></p>' +
    '<p>Мәлімет: ' + esc(t) + '</p></div>').join("") +
    (all.length > hits.length ? '<div class="empty">Тағы ' + (all.length - hits.length) + ' нәтиже бар. Кодтың келесі цифрларын енгізіңіз.</div>' : "");
}
q.addEventListener("input", render);
// [станция атауы, станция коды]
let ST = [];
let STL = [];
const q2 = document.getElementById("q2"), list2 = document.getElementById("list2");
function render2(){
  const v = q2.value.trim();
  if (!v){ list2.innerHTML = ""; return; }
  if (!ST.length){ list2.innerHTML = catMsg(); return; }
  let idx = [];
  if (/^\d+$/.test(v)){
    for (let i = 0; i < ST.length; i++){ const c = ST[i][1]; if (c.startsWith(v) || c.padStart(6,"0").startsWith(v)) idx.push(i); }
  } else {
    const t = v.toLowerCase().split(/\s+/);
    for (let i = 0; i < STL.length; i++){ if (t.every(w => STL[i].includes(w))) idx.push(i); }
  }
  if (!idx.length){ list2.innerHTML = '<div class="empty">Станция табылмады.<br>Атауын немесе кодын қайта тексеріп көріңіз.</div>'; return; }
  const shown = idx.slice(0,100);
  list2.innerHTML = shown.map(i => '<div class="card st"><h2>' + esc(ST[i][0]) + '</h2><p>Код: ' + esc(ST[i][1]) + '</p></div>').join("") +
    (idx.length > shown.length ? '<div class="empty">Тағы ' + (idx.length - shown.length) + ' нәтиже бар. Іздеуді нақтылаңыз.</div>' : "");
}
q2.addEventListener("input", render2);
const V = {home:document.getElementById("v-home"), wagons:document.getElementById("v-wagons"), stations:document.getElementById("v-stations"), hours:document.getElementById("v-hours"), calc:document.getElementById("v-calc")};
const tC = document.getElementById("t-calc"), hg = document.getElementById("home-g");
let vipOn = false; try { vipOn = localStorage.getItem("sg_vip") === "1"; } catch(e){}
function vipUi(){ tC.hidden = !vipOn; hg.dataset.vip = vipOn ? "1" : "0"; }
vipUi();
function setVip(on){ vipOn = !!on; vipUi(); try { vipOn ? localStorage.setItem("sg_vip","1") : localStorage.removeItem("sg_vip"); } catch(e){} if (!vipOn && document.body.dataset.view === "calc") location.hash = "home"; }
window.__setVip = setVip;
function show(view){
  for (const k in V) V[k].hidden = k !== view;
  document.body.dataset.view = view;
  if (view === "hours" && window.__hoursInit) window.__hoursInit();
  if (window.__hit && view !== "calc" && view !== "home") window.__hit(view);
  window.scrollTo(0,0);
}
function route(){ const h = location.hash.slice(1); show(h === "calc" && vipOn ? "calc" : (h === "wagons" || h === "stations" || h === "hours") ? h : "home"); }
window.addEventListener("hashchange", route);
route();
/*CATALOG*/
const CAT_API = "https://saghat-api.g-had-nk.workers.dev";
let catState = "loading", catLast = 0;
function catRead(k){ try { return JSON.parse(localStorage.getItem("cat_" + k) || "null"); } catch(e){ return null; } }
function catWrite(k, o){ try { localStorage.setItem("cat_" + k, JSON.stringify(o)); } catch(e){} }
function catApply(k, rows){ if (k === "cargo") DATA = rows; else { ST = rows; STL = rows.map(r => String(r[0]).toLowerCase()); } }
function catMsg(){ return catState === "loading" ? '<div class="empty">Деректер жүктелуде…</div>' : '<div class="empty">Деректерді жүктеу мүмкін болмады.<br>Интернетті тексеріп, <button id="catRetry" type="button">қайталаңыз</button></div>'; }
function catRefresh(){
  if (q.value) render(); else if (!DATA.length) list.innerHTML = catMsg();
  if (q2.value.trim()) render2(); else if (!ST.length) list2.innerHTML = catMsg();
}
async function catSync(force){
  const n = Date.now(); if (!force && n - catLast < 180000) return; catLast = n;
  try {
    const vr = await fetch(CAT_API + "/api/catalog/ver"); if (!vr.ok) throw new Error("ver"); const v = await vr.json();
    for (const k of ["cargo", "stations"]) {
      if (!v[k]) continue;
      const c = catRead(k); if (c && c.ver === v[k].ver && (k === "cargo" ? DATA : ST).length) continue;

  <div class="cmu">${N(total)} сағат · ауысым ұзақтығы ${F(span)}</div>
  <div class="cmu" style="margin-top:10px">Күндер бойынша (сағат/түнгі)</div>
  <div class="csp">${dayTot.map((v,k)=>N(v)+'/'+N(dayNight[k])).join('-')}</div>
  ${span>1440?'<p class="cwn">Ауысым 24 сағаттан асты, уақыттарды тексеріңіз.</p>':''}
  ${warn.map(w=>`<p class="cwn">${w}</p>`).join('')}
  <div class="ct"><table>${cats.map(([n,c])=>`<tr><td>${n}</td><td>${F(sum(c))}</td></tr>`).join('')}<tr><th>Барлығы</th><th>${F(total)}</th></tr><tr><td>Түнгі сағат (22:00–06:00)</td><td>${F(night)}</td></tr></table></div>
  <div class="ct"><table><tr><th>Кезең</th><th>Уақыт</th><th>Ұзақ.</th><th>Есепке</th></tr>
  ${rows.map(r=>`<tr><td>${r.name}${r.note?`<br><span class="cmu">${r.note}</span>`:''}</td><td>${T(r.a)}–${T(r.b)}</td><td>${F(r.len)}</td><td>${F(r.cnt)}</td></tr>`).join('')}</table></div>`;
}
$('legs').addEventListener('input',e=>{
  const i=e.target.dataset.i,k=e.target.dataset.k;if(i==null)return;
  legs[i][k]=k==='e'?e.target.checked:e.target.value;if(k==='e')renderLegs();calc();
});
['rk','ek'].forEach(s=>$(s).addEventListener('input',calc));
$('start').addEventListener('change',()=>{legs.length=0;legs.push(blank());renderLegs();calc()});
$('add').onclick=()=>{legs.push(blank());renderLegs();calc()};
$('del').onclick=()=>{if(legs.length>1){legs.pop();renderLegs();calc()}};
renderLegs();calc();
})();
/*ENDCALC*/
/*HITS*/
(function(){
  const API='https://saghat-api.g-had-nk.workers.dev';
  let id='';
  try{id=localStorage.getItem('sg_dev')||'';if(!/^[0-9a-f]{24}$/.test(id)){id=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('sg_dev',id)}}catch(e){return}
  const last={};
  window.__hit=v=>{if(v==='calc'||v==='home')return;const n=Date.now();if(last[v]&&n-last[v]<180000)return;last[v]=n;
    try{fetch(API+'/api/hit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({dev:id,view:v}),keepalive:true}).catch(()=>{})}catch(e){}};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)window.__hit(document.body.dataset.view||'wagons')});
  window.__hit(document.body.dataset.view||'wagons');
})();
/*ENDHITS*/
